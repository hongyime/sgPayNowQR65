name: Python Tests

on:
  pull_request:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/python-tests.yml']
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/python-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify helpers and output-directory preservation
        run: python -m unittest discover -v
